name: Sanyojika Security SAST & Vulnerability Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1' # Run weekly on Mondays

jobs:
  sast_scan:
    name: Bandit Python Static Analysis & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit SAST Scanner
        run: |
          bandit -r ai_engine/ -ll -ii

      - name: Execute Full Automated Test Suite
        run: |
          python scripts/run_all_tests.py
